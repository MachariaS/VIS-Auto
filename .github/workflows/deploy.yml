name: Deploy

on:
  push:
    branches:
      - main

# Staging (Railway) is paused — its trial expired. Restore the deploy-staging
# job from git history (and re-add `develop` above) when staging comes back.
jobs:
  deploy-production:
    name: Deploy to Heroku (production)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ubuntu-latest no longer ships the Heroku CLI, which heroku-deploy needs
      - name: Install Heroku CLI
        run: curl -fsSL https://cli-assets.heroku.com/install.sh | sh

      - name: Deploy to Heroku
        uses: akhileshns/heroku-deploy@v3.13.15
        with:
          heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
          heroku_app_name: ${{ secrets.HEROKU_APP_NAME }}
          heroku_email: ${{ secrets.HEROKU_EMAIL }}
          branch: main
